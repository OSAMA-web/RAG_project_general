name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v

      # Note: importing rag/ingestion.py constructs the HuggingFace embedding
      # model at module load time, so the FIRST run of this workflow downloads
      # it (~90MB) — expect that run to take a few minutes longer. The pip
      # cache above speeds up dependency installs on subsequent runs; the
      # embedding model itself isn't cached here, only Python packages.
